<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <style>
      .fav-wave {
        animation: favWave 2.4s linear infinite;
      }
      @keyframes favWave {
        0% { transform: translateX(0); }
        100% { transform: translateX(-16px); }
      }
    </style>
    <clipPath id="tile">
      <rect x="1" y="1" width="30" height="30" rx="7" />
    </clipPath>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#0A2B2A" stroke="#B4EBCB" stroke-opacity="0.3" stroke-width="1.2"/>
  <g clip-path="url(#tile)">
    <path class="fav-wave"
          d="M -16 16 Q -12 9, -8 16 T 0 16 Q 4 9, 8 16 T 16 16 Q 20 9, 24 16 T 32 16 Q 36 9, 40 16 T 48 16"
          stroke="#B4EBCB"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
